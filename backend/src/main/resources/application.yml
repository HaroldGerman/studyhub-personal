spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/studyhub;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  error:
    include-message: never
studyhub:
  jwt:
    secret: ${STUDYHUB_JWT_SECRET:development-secret-must-be-replaced-by-a-strong-64-byte-value}
